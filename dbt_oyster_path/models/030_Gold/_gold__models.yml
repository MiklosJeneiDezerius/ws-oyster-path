version: 2

models:
  - name: g_dim_customer
    description: Gold-facing explicit projection of the Silver SCD2 customer dimension.
    columns:
      - name: customer_key
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null:
              config:
                where: "is_unknown = 0"
      - name: valid_from
        data_tests: [not_null]
      - name: valid_to
        data_tests: [not_null]
      - name: is_inferred_start
        description: Report flag for versions whose start was inferred by the initial-load policy.
        data_tests: [not_null]

  - name: g_dim_account
    description: Gold-facing explicit projection of the Silver SCD2 account dimension.
    columns:
      - name: account_key
        data_tests:
          - unique
          - not_null
      - name: account_id
        data_tests:
          - not_null:
              config:
                where: "is_unknown = 0"
      - name: customer_id
        data_tests:
          - not_null:
              config:
                where: "is_unknown = 0"
      - name: valid_from
        data_tests: [not_null]
      - name: valid_to
        data_tests: [not_null]
      - name: is_inferred_start
        description: Report flag for versions whose start was inferred by the initial-load policy.
        data_tests: [not_null]

  - name: g_dim_debitcard
    description: Gold-facing explicit projection of the Silver SCD2 debit-card dimension.
    columns:
      - name: debitcard_key
        data_tests:
          - unique
          - not_null
      - name: card_id
        data_tests: [not_null]
      - name: account_id
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: valid_to
        data_tests: [not_null]
      - name: is_inferred_start
        description: Report flag for versions whose start was inferred by the initial-load policy.
        data_tests: [not_null]

  - name: g_dim_date
    description: Gold-facing projection of the configured Silver calendar dimension.
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null
      - name: calendar_date
        data_tests:
          - unique
          - not_null

  - name: g_dim_time
    description: Gold-facing projection of the second-grain Silver time dimension.
    columns:
      - name: time_key
        data_tests:
          - unique
          - not_null

  - name: g_fct_transaction
    description: >
      Gold-facing projection of the Silver transaction fact; one row per source
      transaction, retaining its event-time dimension keys and lineage fields.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: account_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('g_dim_account')
                field: account_key
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('g_dim_customer')
                field: customer_key
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('g_dim_date')
                field: date_key
      - name: time_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('g_dim_time')
                field: time_key
      - name: transaction_timestamp
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]

  - name: g_fct_account_tier_daily_snapshot
    description: >
      One row per active account and snapshot date, as of the end of that day.
      Rolling spend includes the snapshot date and preceding 29 calendar days.
      Snapshot dates start at the first transaction date and are capped at the
      configured gold_snapshot_end_date (2026-11-09 by default), never the run
      date. The source-window flag is based on the first observed transaction
      date per account and does not prove upstream source completeness. Missing
      or unrecognized active-card tiers are not silently treated as Standard.
    columns:
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('g_dim_date')
                field: date_key
      - name: snapshot_date
        data_tests: [not_null]
      - name: account_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('g_dim_account')
                field: account_key
      - name: account_id
        data_tests: [not_null]
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('g_dim_customer')
                field: customer_key
      - name: debitcard_key
        data_tests:
          - relationships:
              arguments:
                to: ref('g_dim_debitcard')
                field: debitcard_key
      - name: actual_card_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'no_active_card', 'missing_tier']
      - name: actual_card_tier
      - name: rolling_30_day_spend
        data_tests: [not_null]
      - name: calculated_spending_tier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Standard', 'Gold', 'Platinum']
      - name: upgrade_candidate
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: downgrade_candidate
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: alignment_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['aligned', 'misaligned', 'no_active_card', 'missing_tier', 'unrecognized_tier']
      - name: customer_lookup_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matched', 'no_customer_history']
      - name: has_full_30_day_source_window
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
