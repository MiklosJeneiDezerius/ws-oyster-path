version: 2

sources:
  - name: landing
    description: >
      Raw CSV extracts loaded 1:1 into the Lakehouse by nb_csv_load_source_to_ld
      (latest batch folder only, full overwrite). Input of the Bronze snapshots.
      All business columns are raw text (inferSchema=false); types are applied in Silver.
    database: "{{ env_var('DBT_LANDING_DATABASE', 'lh_oyster_path') }}"
    schema: dbo
    config:
      loaded_at_field: meta_batch_timestamp
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}

    tables:
      - name: customer
        identifier: ld_oys_customer
        description: Customer master data. Current full state, one row per customer.
        columns:
          - name: CustomerID
            data_type: varchar(8000)
            description: Business key of the customer.
            data_tests:
              - unique
              - not_null
          - name: FirstName
            data_type: varchar(8000)
          - name: LastName
            data_type: varchar(8000)
          - name: meta_batch_timestamp
            data_type: datetime2(6)
            description: Source extract time (UTC), parsed from the batch folder name. Same for all tables of one batch.
          - name: meta_load_timestamp
            data_type: datetime2(6)
            description: UTC time the loader wrote the row. Load metadata, not a business change time.
          - name: meta_source_file
            data_type: varchar(8000)
            description: Name of the CSV file the row came from.

      - name: customer_address
        identifier: ld_oys_customeradress
        description: Customer addresses. Source file prefix is misspelled 'CustomerAdress'.
        columns:
          - name: AddressID
            data_type: varchar(8000)
            description: Business key of the address.
            data_tests:
              - unique
              - not_null
          - name: CustomerID
            data_type: varchar(8000)
            description: Customer the address belongs to.
          - name: AddressType
            data_type: varchar(8000)
          - name: Country
            data_type: varchar(8000)
          - name: PostalCode
            data_type: varchar(8000)
          - name: City
            data_type: varchar(8000)
          - name: Street
            data_type: varchar(8000)
          - name: HouseNumber
            data_type: varchar(8000)
          - name: meta_batch_timestamp
            data_type: datetime2(6)
          - name: meta_load_timestamp
            data_type: datetime2(6)
          - name: meta_source_file
            data_type: varchar(8000)

      - name: account
        identifier: ld_oys_account
        description: Customer accounts with current balance.
        columns:
          - name: AccountID
            data_type: varchar(8000)
            description: Business key of the account.
            data_tests:
              - unique
              - not_null
          - name: CustomerID
            data_type: varchar(8000)
            description: Owner of the account.
          - name: Balance
            data_type: varchar(8000)
          - name: meta_batch_timestamp
            data_type: datetime2(6)
          - name: meta_load_timestamp
            data_type: datetime2(6)
          - name: meta_source_file
            data_type: varchar(8000)

      - name: debitcard
        identifier: ld_oys_debitcard
        description: Debit cards linked to accounts.
        columns:
          - name: CardID
            data_type: varchar(8000)
            description: Business key of the card.
            data_tests:
              - unique
              - not_null
          - name: AccountID
            data_type: varchar(8000)
            description: Account the card is linked to.
          - name: CardTier
            data_type: varchar(8000)
          - name: IsActive
            data_type: varchar(8000)
          - name: meta_batch_timestamp
            data_type: datetime2(6)
          - name: meta_load_timestamp
            data_type: datetime2(6)
          - name: meta_source_file
            data_type: varchar(8000)

      - name: transaction_ledger
        identifier: ld_oys_transaction_ledger
        description: Append-only transaction ledger. Rows are never updated once written.
        columns:
          - name: TransactionID
            data_type: varchar(8000)
            description: Business key of the transaction.
            data_tests:
              - unique
              - not_null
          - name: AccountID
            data_type: varchar(8000)
          - name: Amount
            data_type: varchar(8000)
            description: Money. Cast to decimal(18,2) in Silver.
          - name: Timestamp
            data_type: varchar(8000)
            description: Business time of the transaction.
          - name: meta_batch_timestamp
            data_type: datetime2(6)
          - name: meta_load_timestamp
            data_type: datetime2(6)
          - name: meta_source_file
            data_type: varchar(8000)
