version: 2

models:
  - name: dim_date
    description: >
      Static daily calendar with inclusive configurable bounds, independent
      of transaction activity. Monday is ISO weekday 1. No holidays, fiscal
      calendar, timezone conversion, or unknown member is inferred.
    columns:
      - name: date_key
        description: Integer YYYYMMDD.
        data_tests: [unique, not_null]
      - name: calendar_date
        description: One calendar date per row.
        data_tests: [unique, not_null]
      - name: calendar_year
        data_tests: [not_null]
      - name: calendar_quarter
        data_tests: [not_null]
      - name: month_number
        data_tests: [not_null]
      - name: day_of_month
        data_tests: [not_null]
      - name: iso_weekday
        description: Monday 1 through Sunday 7, independent of DATEFIRST.
        data_tests: [not_null]
      - name: is_weekend
        description: Saturday or Sunday flag; not a business holiday calendar.
        data_tests: [not_null]

  - name: dim_time
    description: >
      Static second-grain time-of-day dimension with exactly 86400 rows.
      Reusable across all dates. No timezone or daylight-saving interpretation
      is inferred. Facts retain their complete timestamp separately.
    columns:
      - name: time_key
        description: Integer seconds since midnight, from 0 to 86399.
        data_tests: [unique, not_null]
      - name: time_of_day
        description: Time at second precision; does not replace fact microseconds.
        data_tests: [unique, not_null]
      - name: hour_number
        data_tests: [not_null]
      - name: minute_number
        data_tests: [not_null]
      - name: second_number
        data_tests: [not_null]

  - name: dim_customer
    description: >
      Business SCD2 customer versions with Permanent, Mailing, and Billing
      address groups. Adjacent equal states are coalesced without bridging
      coverage gaps. Times describe observations, not guaranteed effective
      business history. Includes deletion versions and one explicit Unknown member.
      Requires passing upstream history, address, and state reconciliation tests.
    columns:
      - name: customer_key
        description: >
          SHA-256 text version key derived from length-prefixed normalized
          customer ID and the version start timestamp. Stable for unchanged
          history; changing historical boundaries requires coordinated fact rebuilds.
          The synthetic member uses the reserved UNKNOWN_CUSTOMER key instead.
        data_tests: [unique, not_null]
      - name: customer_id
        description: Normalized source business key; NULL only on the synthetic Unknown member.
        data_tests:
          - not_null:
              config:
                where: "is_unknown = 0"
      - name: first_name
        description: Customer first name for this observed version.
      - name: last_name
        description: Customer last name for this observed version.
      - name: valid_from
        description: Inclusive version start.
        data_tests: [not_null]
      - name: valid_to
        description: Exclusive version end; current versions use 9999-12-31.
        data_tests: [not_null]
      - name: is_current
        description: Open-ended version flag, including current deletion tombstones.
        data_tests: [not_null]
      - name: is_deleted
        description: Customer deletion flag; NULL for Unknown, independent of address deletion.
        data_tests:
          - not_null:
              config:
                where: "is_unknown = 0"
      - name: is_unknown
        description: Synthetic Unknown-member flag, not an observed business state.
        data_tests: [not_null]

  - name: dim_account
    description: >
      Observed account SCD2 versions driven by customer ownership and deletion.
      Adjacent equal states are merged without bridging gaps. Balance remains
      in Bronze/staging for a separately defined fact, not in this dimension.
      Requires passing account staging history tests. Includes one explicit Unknown member.
    columns:
      - name: account_key
        description: >
          SHA-256 text key of length-prefixed account ID and version start;
          UNKNOWN_ACCOUNT for the synthetic member.
        data_tests: [unique, not_null]
      - name: account_id
        description: Normalized account business key; NULL only on the synthetic Unknown member.
        data_tests:
          - not_null:
              config:
                where: "is_unknown = 0"
      - name: customer_id
        description: Observed owner business key; not a customer dimension surrogate.
        data_tests:
          - not_null:
              config:
                where: "is_unknown = 0"
      - name: valid_from
        description: Inclusive observation-version start.
        data_tests: [not_null]
      - name: valid_to
        description: Exclusive observation-version end; current uses 9999-12-31.
        data_tests: [not_null]
      - name: is_current
        description: Open-ended version flag, including tombstones.
        data_tests: [not_null]
      - name: is_deleted
        description: Account deletion state; NULL for Unknown rather than assuming an active account.
        data_tests:
          - not_null:
              config:
                where: "is_unknown = 0"
      - name: is_unknown
        description: Synthetic Unknown-member flag, not an observed business state.
        data_tests: [not_null]

  - name: dim_debitcard
    description: >
      Observed card SCD2 versions driven by account, tier, activity, and deletion.
      Adjacent equal states are merged without bridging gaps. Requires passing
      card staging history tests. Transactions do not supply a card ID, so no
      transaction attribution is inferred. No unknown member yet.
    columns:
      - name: debitcard_key
        description: SHA-256 text key of length-prefixed card ID and version start.
        data_tests: [unique, not_null]
      - name: card_id
        description: Normalized card business key; repeats across versions.
        data_tests: [not_null]
      - name: account_id
        description: Observed account business key; not an account dimension surrogate.
        data_tests: [not_null]
      - name: card_tier
        description: Cleaned source tier; no new mandatory-field assumption introduced.
      - name: is_active
        description: Card activity flag, distinct from deletion.
        data_tests: [not_null]
      - name: valid_from
        description: Inclusive observation-version start.
        data_tests: [not_null]
      - name: valid_to
        description: Exclusive observation-version end; current uses 9999-12-31.
        data_tests: [not_null]
      - name: is_current
        description: Open-ended version flag, including tombstones.
        data_tests: [not_null]
      - name: is_deleted
        description: Card deletion state, independent of activity.
        data_tests: [not_null]
