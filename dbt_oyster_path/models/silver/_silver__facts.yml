version: 2

models:
  - name: s_fct_transaction
    description: >
      One row per immutable source TransactionID. Full-table rebuild resolves
      account ownership and customer versions at event time using observed,
      non-deleted history. Missing history maps to explicit Unknown members,
      never inferred first-known ownership. Ambiguous history fails tests.
      Timestamp semantics remain as supplied; no timezone conversion is inferred.
      Balance and card attribution are outside this fact's grain.
    columns:
      - name: transaction_id
        description: Normalized source transaction ID, the degenerate dimension and fact grain.
        data_tests: [unique, not_null]
      - name: transaction_id_raw
        description: Unmodified Bronze transaction identifier.
      - name: account_id
        description: Normalized source account ID, retained even when history is missing.
        data_tests: [not_null]
      - name: account_id_raw
        description: Unmodified Bronze account identifier for lineage.
      - name: customer_id
        description: Owner business ID from the event-time account version; NULL if account is unresolved.
      - name: account_key
        description: Observed event-time version key, or UNKNOWN_ACCOUNT.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('s_dim_account')
                field: account_key
      - name: customer_key
        description: Observed event-time owner version key, or UNKNOWN_CUSTOMER.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('s_dim_customer')
                field: customer_key
      - name: date_key
        description: Transaction calendar date; missing calendar coverage fails validation.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('s_dim_date')
                field: date_key
      - name: time_key
        description: Seconds since midnight, truncating fractional seconds rather than rounding.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('s_dim_time')
                field: time_key
      - name: transaction_timestamp
        description: Full source timestamp at microsecond precision, not replaced by calendar keys.
        data_tests: [not_null]
      - name: amount
        description: Signed decimal(18,2) transaction amount; no currency or balance semantics inferred.
        data_tests: [not_null]
      - name: account_lookup_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matched', 'no_account_history']
      - name: customer_lookup_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matched', 'no_customer_history', 'account_unresolved']
      - name: meta_batch_timestamp
        description: Original ledger extraction batch timestamp, not fact rebuild time.
      - name: meta_load_timestamp
        description: Original landing load timestamp, not fact rebuild time.
      - name: meta_source_file
        description: Original ledger delivery filename.
