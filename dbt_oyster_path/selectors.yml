selectors:
  - name: silver_upstream_checks
    description: Validate existing Landing and Bronze data without running models or snapshots.
    definition:
      intersection:
        - method: resource_type
          value: test
        - union:
            - method: path
              value: models/000_Source
            - method: path
              value: models/010_Bronze
            - method: path
              value: snapshots/bronze
            - method: path
              value: tests/landing
            - method: path
              value: tests/bronze

  - name: silver
    description: Build BIS and Silver models and run their generic and shared singular tests, without rebuilding Bronze.
    definition:
      union:
        - method: path
          value: models/015_BIS
        - method: path
          value: models/020_Silver
        - method: path
          value: tests/silver
